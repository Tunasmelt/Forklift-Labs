  <g font-family="'Courier New', monospace" font-size="12" letter-spacing="2" fill="#8a8078">
    <rect x="330" y="70" width="240" height="34" rx="17" fill="none" stroke="#3a3530"/>
    <text x="365" y="92">PDF &#183; DOCX &#183; PPTX &#183; HTML</text>
